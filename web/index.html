<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频字幕</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#182235;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:8vh auto;padding:32px;background:white;border:1px solid #e1e6ef;border-radius:18px}h1{margin:0;font-size:30px}p{color:#647084}.field{margin:24px 0}label{display:block;font-weight:600;margin-bottom:8px}input,select,button,a{font:inherit}input[type=file]{width:100%;padding:24px;border:2px dashed #b8c7df;border-radius:10px}select{padding:10px;border:1px solid #b8c7df;border-radius:8px}button,.download{display:inline-block;padding:11px 24px;border:0;border-radius:8px;background:#245bd6;color:white;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#jobs article{border-top:1px solid #e1e6ef;padding:20px 0;overflow-wrap:anywhere}progress{width:100%;height:12px}small{color:#647084}#message{color:#a12b20;white-space:pre-wrap}.state{color:#245bd6} @media(max-width:600px){main{margin:20px 12px;padding:22px}}
.download{margin:6px 8px 6px 0}.pipeline{font-size:13px;line-height:1.8;color:#43516a}#translationStatus{display:block;margin-top:8px}details{margin-top:16px}summary{cursor:pointer;color:#43516a;padding:8px 0}.console{background:#111b2c;color:#c8d5e8;border:1px solid #2c3b52;border-radius:10px;padding:14px;height:240px;overflow:auto;font:13px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0}.console .error{color:#ff9999}.console .warning{color:#ffd47d}.log-note{display:block;font-size:12px}
</style>
<main><h1>视频字幕</h1><p>上传音视频，使用 Transub 官方免费版流程生成原文、译文或双语字幕。</p><p class="pipeline">语音识别 → 低置信复核 → 译前质检 → 本地翻译 → 质检修复 → 最终清理</p><div id="health" role="status">正在连接字幕引擎…</div><p id="storageWarning" role="status"></p>
<form id="form"><div class="field"><label for="file">音视频文件</label><input id="file" name="file" type="file" accept=".mp4,.mkv,.mov,.avi,.webm,.m4v,.mpeg,.mpg,.ts,.mp3,.wav,.flac,.m4a,.ogg,.aac" required><small id="limit">单文件最大 24 GiB · 分片上传可续传 · 同时最多两个任务</small></div>
<div class="field"><label for="language">语音语言</label><select id="language" name="language"><option value="auto">自动识别</option><option value="zh">中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option><option value="ru">俄语</option></select></div>
<div class="field"><label for="task">处理方式</label><select id="task" name="task"><option value="dual">生成双语字幕</option><option value="translate">翻译字幕</option><option value="transcribe">原文转写与质检</option></select></div>
<div class="field"><label for="targetLanguage">翻译目标语言</label><select id="targetLanguage" name="targetLanguage"><option value="zh">简体中文</option></select><small id="translationStatus"></small></div>
<button id="submit" disabled>生成字幕</button><p id="message" role="alert"></p><progress id="upload" hidden max="100" aria-label="上传进度"></progress><small id="uploadDetail" role="status"></small><div><button id="pause" type="button" hidden>暂停上传</button> <button id="cancel" type="button" hidden>取消并删除上传文件</button></div></form>
<section id="jobs" aria-label="字幕任务" aria-live="polite"></section></main>
<script>
const $=id=>document.getElementById(id);let ids=[];try{ids=JSON.parse(localStorage.getItem('transub-jobs')||'[]')}catch{}if(!Array.isArray(ids))ids=[];ids=ids.filter(id=>typeof id==='string'&&/^[a-f0-9-]{36}$/.test(id)).slice(0,20);
let maxBytes=24*1024**3,ready=false,uploading=false,translationReady=false,chunkBytes=16*1024**2;
function updateSubmit(){const translating=$('task').value!=='transcribe';$('submit').disabled=!ready||uploading||(translating&&!translationReady);$('targetLanguage').disabled=!translating}
$('task').onchange=updateSubmit;
async function health(){try{const h=await(await fetch('/api/health')).json();ready=h.ok;translationReady=h.translationReady;$('storageWarning').textContent=h.storageWarning||'';chunkBytes=h.chunkBytes||chunkBytes;$('translationStatus').textContent=translationReady?`本地模型 ${h.mtModel} · 无需云端 API`:'本地翻译模型尚未就绪；可先选择原文转写与质检';updateSubmit();$('health').textContent=h.ok?'字幕引擎已连接':'字幕引擎未就绪，请稍后重试';if(h.maxUploadMB){maxBytes=h.maxUploadMB*1024**2;$('limit').textContent=`单文件最大 ${(h.maxUploadMB/1024).toFixed(0)} GiB · 分片续传 · 同时最多 ${h.maxTasks||2} 个任务${h.freeDiskBytes?` · 服务器可用 ${(h.freeDiskBytes/1024**3).toFixed(1)} GiB`:""}`}}catch{ready=false;$('submit').disabled=true;$('health').textContent='无法连接服务'}}health();setInterval(health,15000);
function render(job){
    let article=$(job.id);
    if(!article){article=document.createElement('article');article.id=job.id;$('jobs').prepend(article)}
    const oldDetails=article.querySelector('details'),oldConsole=article.querySelector('.console');
    const expanded=oldDetails?oldDetails.open:true;
    const follow=!oldConsole||oldConsole.scrollHeight-oldConsole.scrollTop-oldConsole.clientHeight<30;
    const previousTop=oldConsole?.scrollTop||0;
    article.replaceChildren();
    const title=document.createElement('strong');title.textContent=job.name||'字幕任务';article.append(title);
    const state=document.createElement('div');state.className='state';
    state.textContent=({uploading:'等待上传或继续上传',queued:'排队中',running:'正在生成字幕',done:'字幕已完成',error:'处理失败',cancelled:'上传已取消'})[job.status]||job.status;
    article.append(state);
    if(job.status==='running'||job.status==='uploading'){
        const progress=document.createElement('progress');progress.max=100;
        const value=job.status==='uploading'?100*(job.received||0)/job.size:Number(job.progress?.percent);if(Number.isFinite(value))progress.value=Math.max(0,Math.min(100,value));
        progress.setAttribute('aria-label','字幕生成进度');article.append(progress);
        const detail=document.createElement('small');detail.textContent=job.status==='uploading'?`已接收 ${((job.received||0)/1024**3).toFixed(2)} / ${(job.size/1024**3).toFixed(2)} GiB；选择相同文件可续传`:job.progress?.detail||job.progress?.stage||'语音识别中…';article.append(detail);
    }
    if(job.error){const error=document.createElement('p');error.textContent=job.error;article.append(error)}
    if(job.canRetry){const retry=document.createElement('button');retry.textContent='使用已上传文件重新处理';retry.onclick=async()=>{retry.disabled=true;try{await api(`/api/jobs/${job.id}/retry`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});refresh()}catch(error){$('message').textContent=error.message;retry.disabled=false}};article.append(retry);const remove=document.createElement('button');remove.textContent='删除已上传源文件';remove.onclick=async()=>{remove.disabled=true;try{await api(`/api/uploads/${job.id}`,{method:'DELETE'});refresh()}catch(error){$('message').textContent=error.message;remove.disabled=false}};article.append(remove)}
    if(job.status==='done'){
        const files=job.outputs?.length?job.outputs:[{label:'字幕',format:'srt'}];
        files.forEach((file,index)=>{
            const link=document.createElement('a');link.href=job.outputs?.length?`/api/jobs/${job.id}/files/${index}`:`/api/jobs/${job.id}/subtitle`;
            link.className='download';link.textContent=`下载${file.label} (${file.format.toUpperCase()})`;article.append(link);
        });
        if(job.qcIssueCount!=null){const qc=document.createElement('p');qc.textContent=`质检剩余问题：${job.qcIssueCount} 项`;article.append(qc)}
    }
    const details=document.createElement('details');details.open=expanded;
    const summary=document.createElement('summary');summary.textContent='处理日志';details.append(summary);
    const console=document.createElement('pre');console.className='console';console.tabIndex=0;console.setAttribute('aria-label','处理日志');
    for(const entry of job.logs||[]){
        const line=document.createElement('span');line.className=entry.level==='error'?'error':entry.level==='warning'?'warning':'';
        const timestamp=new Date(entry.ts*1000).toLocaleTimeString('zh-CN',{hour12:false});
        line.textContent=`[${timestamp}] [${entry.level.toUpperCase()}] ${entry.stage?'['+entry.stage+'] ':''}${entry.message}\n`;console.append(line);
    }
    if(!job.logs?.length)console.textContent='暂无日志记录';
    details.append(console);
    const note=document.createElement('small');note.className='log-note';note.textContent='保留最近 500 条任务事件 · 约每 2.5 秒更新 · 滚动到底部可跟随最新日志';details.append(note);
    article.append(details);
    console.scrollTop=follow?console.scrollHeight:previousTop;
}
async function refresh(){for(const id of ids){try{const r=await fetch(`/api/jobs/${id}`);if(r.ok)render(await r.json());else if(r.status===404){ids=ids.filter(x=>x!==id);$(id)?.remove()}}catch{}}localStorage.setItem('transub-jobs',JSON.stringify(ids))}refresh();setInterval(refresh,2500);
let currentUpload=null,currentXHR=null,paused=false;
try{currentUpload=JSON.parse(localStorage.getItem('transub-upload')||'null')}catch{}
if(currentUpload&&!/^[a-f0-9-]{36}$/.test(currentUpload.id||''))currentUpload=null;
if(currentUpload){$('cancel').hidden=false;$('message').textContent='有未完成上传。重新选择相同文件和处理方式，可从服务器断点继续。'}
function uploadId(){if(crypto.randomUUID)return crypto.randomUUID();const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=[...bytes].map(x=>x.toString(16).padStart(2,'0')).join('');return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`}
function forgetUpload(){localStorage.removeItem('transub-upload');currentUpload=null;$('cancel').hidden=true}
function rememberJob(id){if(!ids.includes(id))ids=[...ids,id].slice(-20);localStorage.setItem('transub-jobs',JSON.stringify(ids));refresh()}
async function api(url,options={}){const response=await fetch(url,options);let data;try{data=await response.json()}catch{throw Error('服务连接异常，请稍后重试')}if(!response.ok){const error=Error(typeof data.detail==='string'?data.detail:'请求失败');error.status=response.status;throw error}return data}
async function identity(file,settings){
    // shortcut: sample identity avoids hashing 20GB; do not modify the source file while resuming.
    const sample=async blob=>btoa(String.fromCharCode(...new Uint8Array(await blob.arrayBuffer())));
    return JSON.stringify([file.name,file.size,settings,await sample(file.slice(0,256)),await sample(file.slice(Math.max(0,file.size-256)))]);
}
function chunk(file,offset,length,started,initial){return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();currentXHR=xhr;xhr.open('PUT',`/api/uploads/${currentUpload.id}`);xhr.timeout=120000;
    xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.setRequestHeader('Upload-Offset',String(offset));
    xhr.upload.onprogress=e=>{const received=offset+e.loaded;$('upload').value=100*received/file.size;const speed=(received-initial)/Math.max(1,(performance.now()-started)/1000);$('uploadDetail').textContent=`${(received/1024**3).toFixed(2)} / ${(file.size/1024**3).toFixed(2)} GiB · ${(speed/1024**2).toFixed(1)} MiB/s`};
    xhr.onload=()=>{try{const data=JSON.parse(xhr.responseText);if(xhr.status!==200){const error=Error(data.detail||'分片上传失败');error.status=xhr.status;throw error}resolve(data.received)}catch(error){reject(error)}};
    xhr.onerror=xhr.ontimeout=()=>reject(Error('网络中断或超时，上传断点已保留'));
    xhr.onabort=()=>reject(Error('上传已暂停，选择相同文件可继续'));
    xhr.send(file.slice(offset,offset+length));
})}
$('pause').onclick=()=>{paused=true;currentXHR?.abort()};
$('cancel').onclick=async()=>{
    if(!currentUpload)return;paused=true;currentXHR?.abort();$('cancel').disabled=true;
    try{
        for(let attempt=0;;attempt++){
            try{await api(`/api/uploads/${currentUpload.id}`,{method:'DELETE'});break}
            catch(error){if(error.status===404)break;if(error.status===409){const latest=await api(`/api/uploads/${currentUpload.id}`);if(latest.status!=='uploading'){rememberJob(currentUpload.id);forgetUpload();$('message').textContent='文件已提交处理，上传关联已解除；本次未执行源文件删除，请查看任务记录';return}}if(error.status!==409||attempt>=10)throw error;await new Promise(resolve=>setTimeout(resolve,200))}
        }
        forgetUpload();$('cancel').hidden=true;$('upload').hidden=true;$('message').textContent='上传已取消，源文件已删除';refresh();
    }catch(error){$('message').textContent=error.message}finally{$('cancel').disabled=false}
};
$('form').onsubmit=async e=>{
    e.preventDefault();const file=$('file').files[0];if(!file)return;if(file.size>maxBytes){$('message').textContent='文件超过上传限制';return}
    uploading=true;paused=false;updateSubmit();$('message').textContent='';$('upload').hidden=false;$('pause').hidden=false;
    try{
        const settings={language:$('language').value,task:$('task').value,targetLanguage:$('targetLanguage').value};
        const fingerprint=await identity(file,settings);let state;
        if(currentUpload){
            try{state=await api(`/api/uploads/${currentUpload.id}`)}catch(error){if(error.status!==404)throw error;if(!currentUpload.pending)forgetUpload()}
            if(state&&state.status!=='uploading'){
                const sameFile=currentUpload.fingerprint===fingerprint;rememberJob(currentUpload.id);forgetUpload();
                if(sameFile&&state.status!=='cancelled'){$('upload').hidden=true;$('uploadDetail').textContent='';$('message').textContent=state.status==='error'?'上次任务处理失败，请在任务记录中重试或重新上传':'文件已提交，无需重复上传，请查看任务记录';return}
                state=null;
            }
            if(currentUpload&&currentUpload.fingerprint!==fingerprint)throw Error('有其他未完成上传，请先取消，或选择原来的文件和处理方式');
        }
        if(!currentUpload||!state){
            if(!currentUpload){currentUpload={id:uploadId(),fingerprint,pending:true};localStorage.setItem('transub-upload',JSON.stringify(currentUpload))}
            $('cancel').hidden=true;
            const created=await api('/api/uploads',{method:'POST',headers:{'Content-Type':'application/json','Upload-ID':currentUpload.id},body:JSON.stringify({name:file.name,size:file.size,fingerprint,...settings})});
            currentUpload.id=created.id;currentUpload.pending=false;localStorage.setItem('transub-upload',JSON.stringify(currentUpload));state={status:created.status||'uploading',received:created.received||0};rememberJob(created.id);
        }
        $('cancel').hidden=false;
        if(state.status==='uploading'){
            let offset=state.received||0,retries=0;const initial=offset,started=performance.now();
            while(offset<file.size){
                if(paused)throw Error('上传已暂停，断点已保留');
                try{offset=await chunk(file,offset,Math.min(chunkBytes,file.size-offset),started,initial);retries=0}
                catch(error){
                    if(paused||[400,413,507].includes(error.status)||++retries>3)throw error;
                    $('message').textContent=`连接异常，正在恢复断点（${retries}/3）…`;await new Promise(resolve=>setTimeout(resolve,1000*retries));
                    const latest=await api(`/api/uploads/${currentUpload.id}`);if(latest.status!=='uploading')throw Error('任务状态已改变，请刷新查看');offset=latest.received||0;
                }
            }
            if(paused)throw Error('上传已暂停，断点已保留');
            $('uploadDetail').textContent='上传完成，正在校验音轨…';
            await api(`/api/uploads/${currentUpload.id}/complete`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
        }else if(!['queued','running','done'].includes(state.status)){throw Error('该上传已取消或处理失败，请查看任务记录')}
        rememberJob(currentUpload.id);forgetUpload();$('cancel').hidden=true;$('upload').hidden=true;$('uploadDetail').textContent='';$('message').textContent='上传完成，任务已提交';$('form').reset();
    }catch(error){$('message').textContent=error.message;$('cancel').hidden=!currentUpload}
    finally{uploading=false;currentXHR=null;$('pause').hidden=true;updateSubmit()}
};
</script></html>
